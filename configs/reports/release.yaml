known_limitations:
  - DERCo has no declared dataset license; this local real-data bundle must not be redistributed.
  - The posterior LM-surprisal coefficient is conditional association, not a causal model-to-brain effect.
  - Held-out predictive gains are weak and mean held-out R-squared remains near zero.
  - The sensor-time cluster analysis is exploratory and does not identify exact onset or neural sources.
