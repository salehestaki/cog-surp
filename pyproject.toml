[project]
name = "cog-surp"
version = "0.1.0"
description = "Reproducible benchmarking workbench for language-model prediction measures and human N400 responses."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Cog-Surp contributors" }]
keywords = ["EEG", "N400", "surprisal", "psycholinguistics", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "platformdirs>=4.3",
  "psutil>=7.0",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "rich>=14.0",
  "typer>=0.16",
]

[project.optional-dependencies]
data = [
  "duckdb>=1.3",
  "pandas>=2.3",
  "polars>=1.31",
  "pyarrow>=20.0",
]
eeg = [
  "mne>=1.10",
  "mne-bids>=0.17",
]
lm = [
  "torch>=2.7",
  "transformers>=4.53",
]
statistics = [
  "arviz>=0.22",
  "bambi>=0.15",
  "h5py>=3.14",
  "h5netcdf>=1.6",
  "pymc>=5.25",
  "scikit-learn>=1.7",
  "scipy>=1.15,<1.16",
  "statsmodels>=0.14",
]
causal = [
  "dowhy>=0.13",
  "networkx>=3.5",
]
dashboard = [
  "plotly>=6.2",
  "streamlit>=1.47",
]
all = [
  "arviz>=0.22",
  "bambi>=0.15",
  "dowhy>=0.13",
  "duckdb>=1.3",
  "h5py>=3.14",
  "h5netcdf>=1.6",
  "mne>=1.10",
  "mne-bids>=0.17",
  "networkx>=3.5",
  "pandas>=2.3",
  "plotly>=6.2",
  "polars>=1.31",
  "pyarrow>=20.0",
  "pymc>=5.25",
  "scikit-learn>=1.7",
  "scipy>=1.15,<1.16",
  "statsmodels>=0.14",
  "streamlit>=1.47",
  "torch>=2.7",
  "transformers>=4.53",
]

[project.scripts]
cog-surp = "cog_surp.cli.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "hypothesis>=6.135",
  "mypy>=1.16",
  "pre-commit>=4.2",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-psutil>=7.0",
  "types-pyyaml>=6.0",
  "types-networkx>=3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cog_surp"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cog_surp"]

[[tool.mypy.overrides]]
module = ["mne", "mne.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dowhy", "dowhy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "arviz",
  "arviz.*",
  "bambi",
  "bambi.*",
  "plotly",
  "plotly.*",
  "scipy",
  "scipy.*",
  "sklearn",
  "sklearn.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["cog_surp"]
